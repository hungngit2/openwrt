name: Build Xiaomi Mi Router 3 ROM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'target/linux/ramips/**'
      - '.github/workflows/build-xiaomi-r3.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget swig libelf-dev

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure .config
        run: |
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7620=y" >> .config
          echo "CONFIG_TARGET_DEVICE_ramips_mt7620_DEVICE_xiaomi_miwifi-r3=y" >> .config
          make defconfig

      - name: Download Packages
        run: make download -j8

      - name: Build Firmware
        run: make -j$(nproc) V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ramips-mt7620-xiaomi_miwifi-r3-firmware
          path: bin/targets/ramips/mt7620/*
